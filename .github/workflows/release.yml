name: Semantic Release Test


on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:      
    branches:
      - main
  workflow_dispatch: 
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
 
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest 
    permissions:
      contents: write
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} 

    
      - name: Setup Python (for Python projects)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install Python versioning tools
        run: |
          pip install bump2version
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
    
      - name: Determine version bump type
        id: version_bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            # Auto-determine from commit messages
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE:"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$COMMIT_MSG" | grep -qE "^feat(\(.+\))?:"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Version bump type: $(cat $GITHUB_OUTPUT | grep type)"
      
      - name: Bump version (Python)
        id: bump_version
        run: |
          # Create .bumpversion.cfg if it doesn't exist
          if [ ! -f ".bumpversion.cfg" ]; then
            # Try to get current version from pyproject.toml or setup.py
            if [ -f "pyproject.toml" ]; then
              CURRENT_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"(.*)"/\1/' | head -1)
            elif [ -f "setup.py" ]; then
              CURRENT_VERSION=$(grep -E 'version\s*=' setup.py | sed -E "s/.*version\s*=\s*['\"]([^'\"]*)['\"].*/\1/" | head -1)
            else
              CURRENT_VERSION="0.1.0"
            fi
            
            cat > .bumpversion.cfg << EOF
          [bumpversion]
          current_version = ${CURRENT_VERSION:-0.1.0}
          commit = True
          tag = False
          message = chore(release): bump version to {new_version} [skip ci]
          
          [bumpversion:file:pyproject.toml]
          search = version = "{current_version}"
          replace = version = "{new_version}"
          
          [bumpversion:file:setup.py]
          search = version="{current_version}"
          replace = version="{new_version}"
          EOF
          fi
          
          # Bump version
          bump2version ${{ steps.version_bump.outputs.type }} --allow-dirty
          
          # Get new version
          NEW_VERSION=$(grep 'current_version' .bumpversion.cfg | sed 's/current_version = //')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumped to version: $NEW_VERSION"
 
      - name: Push changes
        run: | 
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          release_name: Release v${{ steps.bump_version.outputs.new_version }}
          body: |
            ## Changes in v${{ steps.bump_version.outputs.new_version }}
            
            Project type: ${{ steps.version_bump.outputs.type }}
            
            See the [commit history](https://github.com/${{ github.repository }}/commits/v${{ steps.bump_version.outputs.new_version }}) for details..
          draft: false 
          prerelease: false